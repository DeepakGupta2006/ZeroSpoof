# ZeroSpoof full stack:  docker compose up --build
#   web        http://localhost:3000   demo + dashboard
#   gateway    ws://localhost:8080/ws  Go WebSocket ingest (what browsers connect to)
#   inference  http://localhost:8000   REST API + /docs (what your backend calls)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zerospoof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zerospoof}
      POSTGRES_DB: zerospoof
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerospoof"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  inference:
    build: ./inference
    environment:
      ZS_ENV: ${ZS_ENV:-dev}
      DATABASE_URL: postgresql://zerospoof:${POSTGRES_PASSWORD:-zerospoof}@postgres:5432/zerospoof
      REDIS_URL: redis://redis:6379/0
      ZS_PUBLIC_WS_URL: ${ZS_PUBLIC_WS_URL:-ws://localhost:8080/ws}
      ZS_CORS_ORIGINS: ${ZS_CORS_ORIGINS:-http://localhost:3000}
      ZS_ADMIN_KEY: ${ZS_ADMIN_KEY:-zs_admin_dev}
      ZS_DEV_API_KEY: ${ZS_DEV_API_KEY:-zs_live_dev}
      ZS_TOKEN_SECRET: ${ZS_TOKEN_SECRET:-dev-token-secret-change-me}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]

  gateway:
    build: ./gateway
    environment:
      UPSTREAM_WS: ws://inference:8000/ws
      ZS_ALLOWED_ORIGINS: ${ZS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on: [inference]
    ports: ["8080:8080"]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_MEDIAPIPE_WASM_URL: ${NEXT_PUBLIC_MEDIAPIPE_WASM_URL:-https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm}
        NEXT_PUBLIC_FACE_MODEL_URL: ${NEXT_PUBLIC_FACE_MODEL_URL:-https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task}
    environment:
      ZEROSPOOF_API_URL: http://inference:8000
      ZEROSPOOF_API_KEY: ${ZS_DEV_API_KEY:-zs_live_dev}
      ZEROSPOOF_ADMIN_KEY: ${ZS_ADMIN_KEY:-zs_admin_dev}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    depends_on: [inference]
    ports: ["3000:3000"]

volumes:
  pgdata:
